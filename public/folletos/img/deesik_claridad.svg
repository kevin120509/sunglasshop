<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <linearGradient id="lensC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#7ec8e3" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <rect width="900" height="300" fill="#0f0f0f"/>

  <!-- Ojo -->
  <path d="M80 150 Q 210 55 340 150 Q 210 245 80 150 Z" fill="none" stroke="#e5e5e5" stroke-width="4"/>
  <circle cx="210" cy="150" r="52" fill="none" stroke="#7ec8e3" stroke-width="4"/>
  <circle cx="210" cy="150" r="24" fill="#7ec8e3" fill-opacity="0.7"/>
  <circle cx="218" cy="140" r="8" fill="#ffffff" opacity="0.9"/>

  <!-- Rayos nítidos atravesando la mica -->
  <line x1="400" y1="80"  x2="700" y2="80"  stroke="#7ec8e3" stroke-width="3" opacity="0.9"/>
  <line x1="400" y1="115" x2="700" y2="115" stroke="#7ec8e3" stroke-width="3" opacity="0.75"/>
  <line x1="400" y1="150" x2="700" y2="150" stroke="#7ec8e3" stroke-width="3" opacity="0.9"/>
  <line x1="400" y1="185" x2="700" y2="185" stroke="#7ec8e3" stroke-width="3" opacity="0.75"/>
  <line x1="400" y1="220" x2="700" y2="220" stroke="#7ec8e3" stroke-width="3" opacity="0.9"/>

  <!-- Mica -->
  <circle cx="620" cy="150" r="105" fill="url(#lensC)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3"/>
  <path d="M560 65 A 105 105 0 0 1 660 52" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round"/>

  <!-- Chispa de nitidez -->
  <path d="M790 60 l6 18 18 6 -18 6 -6 18 -6 -18 -18 -6 18 -6 Z" fill="#dc2626"/>
</svg>
