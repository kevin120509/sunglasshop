<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <rect width="900" height="300" fill="#0f0f0f"/>

  <!-- Sol -->
  <circle cx="110" cy="95" r="34" fill="#facc15"/>
  <g stroke="#facc15" stroke-width="4" stroke-linecap="round">
    <line x1="110" y1="40" x2="110" y2="22"/>
    <line x1="148" y1="57" x2="160" y2="45"/>
    <line x1="165" y1="95" x2="183" y2="95"/>
    <line x1="148" y1="133" x2="160" y2="145"/>
    <line x1="72" y1="57" x2="60" y2="45"/>
    <line x1="55" y1="95" x2="37" y2="95"/>
    <line x1="72" y1="133" x2="60" y2="145"/>
  </g>

  <!-- Rayos UV que llegan -->
  <g stroke="#a78bfa" stroke-width="4" stroke-linecap="round">
    <line x1="200" y1="95"  x2="430" y2="118"/>
    <line x1="200" y1="140" x2="430" y2="150"/>
    <line x1="200" y1="185" x2="430" y2="182"/>
  </g>

  <!-- Mica vertical que bloquea -->
  <ellipse cx="445" cy="150" rx="18" ry="115" fill="#7ec8e3" fill-opacity="0.2" stroke="#ffffff" stroke-opacity="0.8" stroke-width="3"/>
  <ellipse cx="445" cy="150" rx="9" ry="115" fill="#ffffff" fill-opacity="0.12"/>

  <!-- Rayos bloqueados (fragmentos al otro lado) -->
  <g stroke="#a78bfa" stroke-width="4" stroke-linecap="round" opacity="0.18">
    <line x1="470" y1="118" x2="520" y2="123"/>
    <line x1="470" y1="150" x2="520" y2="150"/>
    <line x1="470" y1="182" x2="520" y2="177"/>
  </g>

  <!-- Escudo -->
  <path d="M640 105 L700 125 L700 175 Q 700 215 640 235 Q 580 215 580 175 L580 125 Z" fill="#0f0f0f" stroke="#dc2626" stroke-width="4"/>
  <path d="M615 168 L633 186 L670 145" fill="none" stroke="#dc2626" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="640" y="265" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#e5e5e5">UV 100%</text>
</svg>
